# A version tag (vX.Y.Z, matching package.json and vscode/package.json) builds the VS Code extension and attaches it to a GitHub Release
name: Release extension

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  # Trusted Publishing to the VS Code Marketplace (OIDC, no stored token)
  id-token: write

jobs:
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode/package-lock.json
      - name: Check that the tag matches the app and extension version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for file in package.json vscode/package.json; do
            FILE_VERSION=$(node -p "require('./$file').version")
            if [ "$FILE_VERSION" != "$VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the version $FILE_VERSION in $file"
              exit 1
            fi
          done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - name: Package the extension
        working-directory: vscode
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx vsce package -o "../draw-tikz-$VERSION.vsix"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "draw-tikz-$VERSION.vsix"
          --title "draw.tikz $GITHUB_REF_NAME"
          --notes "VS Code extension draw-tikz-$VERSION.vsix. Install it with Extensions > ... > Install from VSIX."
      # needs a Trusted Publishing policy for this repository and release.yml on the willem-v publisher (marketplace.visualstudio.com/manage)
      - name: Publish to the VS Code Marketplace
        working-directory: vscode
        run: npx vsce publish --oidc --packagePath "../draw-tikz-$VERSION.vsix"
      # Open VSX, once its token is added as repository secret:
      # - run: npx ovsx publish "draw-tikz-$VERSION.vsix" -p "${{ secrets.OVSX_PAT }}"
